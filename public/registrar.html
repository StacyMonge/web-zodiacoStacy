    <main class="row">
        <h4>Registro de usuarios</h4>

        <div>
            <label for="txtNombre">Nombre:</label><br>
            <input type="text" id="txtNombre" required><br><br>

            <label for="txtEmail">Correo electrónico:</label><br>
            <input type="email" id="txtEmail" required><br><br>

            <label for="txtContra">Contraseña:</label><br>
            <input type="password" id="txtContra" required><br><br>

            <label for="txtFechaCreacion">Fecha de creación:</label><br>
            <input type="datetime-local"
                   id="txtFechaCreacion"
                   readonly><br><br>

            <input type="button"
                   id="btnInsUser"
                   name="btnInsUser"
                   value="Insertar Usuario">
        </div>
